<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pesquisa sobre decisões de gestores</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#1d2330}
  main{max-width:30rem;padding:2rem 1.25rem;text-align:center}
  h1{font-size:1.25rem;margin:0 0 .75rem}
  p{line-height:1.5;margin:.5rem 0}
  a.btn{display:inline-block;margin-top:1rem;padding:.7rem 1.2rem;border-radius:.5rem;background:#1f5fbf;color:#fff;text-decoration:none}
  @media (prefers-color-scheme:dark){body{background:#14171d;color:#e8eaf0}}
</style>
</head>
<body>
<main>
  <h1>Pesquisa sobre decisões de gestores</h1>
  <p id="msg">Abrindo o questionário…</p>
  <noscript><p>Ative o JavaScript para continuar.</p></noscript>
  <a id="manual" class="btn" href="#" hidden>Abrir o questionário</a>
</main>
<script>
/* ===== CONFIGURAÇÃO =====
   1) Troque os 4 links abaixo pelos links de resposta dos Forms (os que terminam em /viewform).
   2) PESOS: 1 = chance normal; 0 = não envia mais ninguém para esse formulário; 2 = o dobro de chance.
      Use os pesos só para equilibrar o fim da coleta (ex.: A já tem muitos → A: 0).
      Sempre que mudar um peso, registre a data e os valores no diário da coleta (vai para o método).
*/
var FORMS = {
  A: { url: "https://docs.google.com/forms/d/e/1FAIpQLSeA1AkFc_2eDpmSSM1kjG32ycAs3gvBHBixAcLUlb3sKYk76g/viewform", peso: 1 },
  B: { url: "https://docs.google.com/forms/d/e/1FAIpQLSeacwZlpaG3JlmfZV6l3UgmzLZsF3nfH3gT-BJwOj2-XmzB8A/viewform", peso: 1 },
  C: { url: "https://docs.google.com/forms/d/e/1FAIpQLSdxfFwFea_Kc59CFRUcPxgVU6q6ISDUBSXzILoVRw93qb6w_A/viewform", peso: 1 },
  D: { url: "https://docs.google.com/forms/d/e/1FAIpQLSe21G0JXX7ste5pmIviL-LVxMoRPlnNIzH9uSYFFxOb4et8hg/viewform", peso: 1 }
};
var CHAVE = "tdo_grupo_v1"; /* só guarda a letra sorteada neste navegador, para quem reabrir o link ir ao MESMO formulário */

function sortear() {
  var letras = Object.keys(FORMS).filter(function (k) { return FORMS[k].peso > 0; });
  var total = letras.reduce(function (s, k) { return s + FORMS[k].peso; }, 0);
  var r;
  if (window.crypto && crypto.getRandomValues) { r = (crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296) * total; }
  else { r = Math.random() * total; }
  var acum = 0;
  for (var i = 0; i < letras.length; i++) { acum += FORMS[letras[i]].peso; if (r < acum) return letras[i]; }
  return letras[letras.length - 1];
}

(function () {
  var params = new URLSearchParams(location.search);
  var grupo = null;

  /* uso só para o piloto: ?teste=B abre o Form B sem gravar nada */
  var teste = (params.get("teste") || "").toUpperCase();
  var modoTeste = FORMS[teste] ? true : false;
  if (modoTeste) { grupo = teste; }

  if (!grupo) { try { var salvo = localStorage.getItem(CHAVE); if (salvo && FORMS[salvo]) grupo = salvo; } catch (e) {} }
  if (!grupo) {
    grupo = sortear();
    try { localStorage.setItem(CHAVE, grupo); } catch (e) {}
  }

  var url = FORMS[grupo].url;
  var link = document.getElementById("manual");
  if (!/^https:\/\//.test(url)) {
    document.getElementById("msg").textContent = "Página ainda não configurada.";
    return;
  }
  link.href = url; link.hidden = false;
  setTimeout(function () { location.replace(url); }, 400);
})();
</script>
</body>
</html>
